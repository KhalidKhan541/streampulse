version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: streampulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: '1'
      KAFKA_CFG_PROCESS_ROLES: 'controller,broker'
      KAFKA_CFG_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CFG_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_CFG_NUM_PARTITIONS: '6'
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: '1'
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: streampulse-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: streampulse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: streampulse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: streampulse
      POSTGRES_USER: streampulse
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streampulse"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: streampulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── StreamPulse Application ─────────────────────────────
  producer:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: streampulse-producer
    command: ["python", "-m", "streampulse.cli", "produce", "--rate", "200"]
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  processor:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: streampulse-processor
    command: ["python", "-m", "streampulse.cli", "consume"]
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: streampulse-api
    command: ["python", "-m", "streampulse.cli", "serve"]
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka_data:
  clickhouse_data:
  postgres_data:
  redis_data:
