version: "3.9"

services:
  # Production overrides: resource limits, replicas, no ports exposed
  kafka:
    image: bitnami/kafka:3.7
    deploy:
      replicas: 3
      resources:
        limits: { memory: 4G, cpus: "2.0" }
        reservations: { memory: 2G, cpus: "1.0" }
    volumes:
      - kafka_data:/bitnami/kafka

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    deploy:
      replicas: 2
      resources:
        limits: { memory: 8G, cpus: "4.0" }
        reservations: { memory: 4G, cpus: "2.0" }
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  processor:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    deploy:
      replicas: 3
      resources:
        limits: { memory: 2G, cpus: "1.0" }
    restart: always

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    deploy:
      replicas: 2
      resources:
        limits: { memory: 1G, cpus: "0.5" }
    restart: always
